name: Patch Classroom copy and setup error

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-classroom-copy-and-setup-error.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update Classroom copy and database guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('google-classroom-integration.js')
          text = path.read_text()

          replacements = {
              "Connect Lindsay's existing training course, match DJs, and synchronize progress.": "Connect the existing training course, match DJs, and synchronize progress.",
              "Connect Lindsay's Google Classroom": "Connect Google Classroom",
              "Loading Lindsay’s classrooms…": "Loading classrooms…",
              "Could not load Lindsay’s classrooms: ": "Could not load classrooms: ",
          }
          for old, new in replacements.items():
              if old not in text:
                  print(f'Notice: text not found: {old}')
              text = text.replace(old, new)

          old_error = """        return detail;
    }

    function formatDateTime(value) {"""
          new_error = """        if (/google_classroom_connections|schema cache|Could not find the table/i.test(detail)) {
            return 'The Google Classroom database setup has not been completed. Run RUN_THIS_ONCE_GOOGLE_CLASSROOM.sql in the Supabase SQL Editor, then refresh this page.';
        }
        return detail;
    }

    function formatDateTime(value) {"""
          if old_error not in text:
              raise SystemExit('Could not find the Classroom error-message insertion point.')
          text = text.replace(old_error, new_error, 1)
          path.write_text(text)

          training = Path('dj-training.js')
          if training.exists():
              t = training.read_text()
              t = t.replace('Lindsay or another administrator must complete this item.', 'An administrator must complete this item.')
              training.write_text(t)

          sql = Path('supabase/RUN_THIS_ONCE_GOOGLE_CLASSROOM.sql')
          if sql.exists():
              s = sql.read_text()
              if "notify pgrst, 'reload schema';" not in s:
                  s = s.rstrip() + "\n\n-- Refresh the Supabase API schema cache immediately.\nnotify pgrst, 'reload schema';\n"
                  sql.write_text(s)

          remaining = []
          for candidate in [path, training]:
              if candidate.exists() and 'lindsay' in candidate.read_text().lower():
                  remaining.append(str(candidate))
          if remaining:
              raise SystemExit('Person-specific copy remains in: ' + ', '.join(remaining))
          PY

      - name: Commit the copy and setup guidance update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-classroom-integration.js dj-training.js supabase/RUN_THIS_ONCE_GOOGLE_CLASSROOM.sql
          git commit -m "Use generic Classroom copy and clarify database setup"
          git push origin HEAD:main

# Trigger after initial workflow creation.
