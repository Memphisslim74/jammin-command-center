name: Install Submissions and Manager Training Access

on:
  push:
    branches:
      - main
    paths:
      - my-submissions.js
      - manager-training-access.js
      - scripts/install_personal_submissions_manager_training.py
      - .github/workflows/install-submissions-training-access.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate new JavaScript files
        run: |
          node --check my-submissions.js
          node --check manager-training-access.js

      - name: Add scripts to the application
        run: python3 scripts/install_personal_submissions_manager_training.py

      - name: Commit validated application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add combined submissions page and reliable manager training tab"
            git push origin HEAD:main
          fi
