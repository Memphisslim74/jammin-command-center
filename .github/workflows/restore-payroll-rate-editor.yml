name: Restore Payroll Hourly Rate Editor

on:
  push:
    branches:
      - main
    paths:
      - scripts/restore_payroll_rate_editor.py
      - .github/workflows/restore-payroll-rate-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore hourly rate editor
        run: python3 scripts/restore_payroll_rate_editor.py

      - name: Validate payroll JavaScript
        run: node --check bookkeeper-payroll.js

      - name: Commit validated payroll rate editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookkeeper-payroll.js
          if ! git diff --cached --quiet; then
            git commit -m "Restore inline payroll hourly rate editing"
            git push origin HEAD:main
          fi
