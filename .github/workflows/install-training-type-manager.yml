name: Install training type manager

on:
  push:
    branches:
      - main
    paths:
      - training-type-manager.js

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect training type manager to the app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '    <script src="training-type-manager.js"></script>\n'
          if marker not in text:
              anchor = '    <script src="staff-card-layout.js"></script>\n'
              if anchor not in text:
                  raise SystemExit('Could not find the staff-card-layout.js script tag.')
              text = text.replace(anchor, anchor + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Training type manager is already connected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect training type manager"
          git push origin HEAD:main
