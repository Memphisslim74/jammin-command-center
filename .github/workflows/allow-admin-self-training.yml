name: Allow admin self training sign-off

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Allow administrators to manage their own training
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dj-training.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "${canSignTraining() && profile.id !== currentId() && progress.isComplete ?": "${canSignTraining() && (isAdmin() || profile.id !== currentId()) && progress.isComplete ?",
              "const canEdit = canSignTraining() && profile.id !== currentId() && !managerBlocked;": "const canEdit = canSignTraining() && (isAdmin() || profile.id !== currentId()) && !managerBlocked;",
              "${canSignTraining() && profile.id !== currentId() ? `": "${canSignTraining() && (isAdmin() || profile.id !== currentId()) ? `",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected code was not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check dj-training.js
          if git diff --quiet -- dj-training.js; then
            echo "Admin self-training access is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dj-training.js
          git commit -m "Allow admins to complete their own training"
          git push origin HEAD:main
