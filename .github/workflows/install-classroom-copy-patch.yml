name: Install Classroom copy patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-classroom-copy-patch.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add patch script to index
        shell: bash
        run: python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); marker="    <script src=\"google-classroom-integration.js\"></script>"; insert=marker+"\n    <script src=\"classroom-copy-patch.js\"></script>"; assert marker in s, "Classroom integration script marker not found"; p.write_text(s if "classroom-copy-patch.js" in s else s.replace(marker, insert, 1))'

      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load generic Classroom copy patch"
          git push origin HEAD:main
