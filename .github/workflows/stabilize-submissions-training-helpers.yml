name: Stabilize Submissions and Training Helpers

on:
  push:
    branches:
      - main
    paths:
      - scripts/stabilize_submissions_training_helpers.py
      - .github/workflows/stabilize-submissions-training-helpers.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply stability patch
        run: python3 scripts/stabilize_submissions_training_helpers.py

      - name: Validate helper JavaScript
        run: |
          node --check my-submissions.js
          node --check manager-training-access.js

      - name: Commit stabilized helper scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-submissions.js manager-training-access.js
          if ! git diff --cached --quiet; then
            git commit -m "Prevent repeated helper observer updates"
            git push origin HEAD:main
          fi
