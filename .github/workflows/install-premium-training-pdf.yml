name: Install premium training PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add premium PDF script to the live page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          premium = '<script src="dj-training-premium-print.js"></script>'
          if premium not in text:
              marker = '<script src="dj-training.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find the DJ training script tag.')
              text = text.replace(marker, marker + '\n    ' + premium, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check dj-training-premium-print.js
          if git diff --quiet -- index.html; then
            echo "Premium PDF script is already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable premium branded training PDFs"
          git push origin HEAD:main
