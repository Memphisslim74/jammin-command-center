name: Deploy Google Classroom functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rndcrsjiaqaoendbhqec
    steps:
      - name: Check out Command Center
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Confirm deployment token exists
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub repository secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy Google Classroom authorization callback
        run: supabase functions deploy google-classroom-auth --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy Google Classroom synchronization service
        run: supabase functions deploy google-classroom-sync --project-ref "$PROJECT_REF" --no-verify-jwt
